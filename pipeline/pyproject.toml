[project]
name = "insightforge-pipeline"
version = "0.1.0"
description = "Optional Apache Airflow ETL pipeline for InsightForge (advanced/developer feature)."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["dags*", "transforms*", "cli*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
